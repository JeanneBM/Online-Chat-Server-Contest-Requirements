<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Chat - FINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, sans-serif; display:flex; flex-direction:column; height:100vh; }
        .header { background:#007bff; color:white; padding:12px; text-align:center; font-size:1.2em; }
        .main { display:flex; flex:1; overflow:hidden; }
        .sidebar { width:260px; background:#f8f9fa; padding:15px; overflow-y:auto; border-right:1px solid #ddd; }
        .chat-area { flex:1; display:flex; flex-direction:column; }
        .messages { flex:1; padding:15px; overflow-y:auto; background:#fff; }
        .message { margin-bottom:12px; padding:10px; border-radius:8px; background:#f1f1f1; position:relative; }
        .message .delete-btn { position:absolute; right:8px; top:8px; color:red; cursor:pointer; display:none; }
        .message:hover .delete-btn { display:block; }
        .input-area { padding:12px; background:#f8f9fa; display:flex; gap:8px; align-items:center; }
    </style>
</head>
<body>

<div class="header">Online Chat - FINAL VERSION</div>

<div class="main">
    <div class="sidebar">
        <h4>Public Rooms</h4>
        <button onclick="loadPublicRooms()">Refresh</button>
        <button onclick="logout()" style="margin-left:8px;background:#dc3545;color:white;">Logout</button>
        <div id="room-count" style="margin-top:8px;font-size:0.9em;color:#666;"></div>
        <div id="room-list"></div>
        <ul id="room-names" style="padding-left:18px;margin-top:10px;"></ul>

        <hr>
        <input id="new-room-name" placeholder="Room name">
        <button onclick="createRoom()">Create</button>

        <hr>
        <h4>Friends</h4>
        <input id="friend-username" placeholder="Username">
        <button onclick="sendFriendRequest()">Invite</button>
        <div id="friends-list"></div>

        <hr>
        <h4>Direct Chat 1:1</h4>
        <input id="private-username" placeholder="Username">
        <button onclick="startPrivateChat()">Start</button>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="message-input" placeholder="Type a message..." style="flex:1">
            <input type="file" id="file-input" style="display:none" onchange="uploadAndSend()">
            <button onclick="document.getElementById('file-input').click()">📎</button>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<div id="auth-panel" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;">
    <h2>Online Chat</h2>
    <input id="username" placeholder="Username" value="testuser" style="margin:8px;padding:12px;width:300px;"><br>
    <input id="password" type="password" placeholder="Password" value="test123" style="margin:8px;padding:12px;width:300px;"><br>
    <button onclick="login()" style="margin:8px;padding:12px 30px;width:300px;">Sign In</button>
    <button onclick="register()" style="margin:8px;padding:12px 30px;width:300px;background:#28a745;">Register</button>
    <div id="user-info" style="margin-top:12px;font-size:14px;opacity:0.9;"></div>
</div>

<script>
    let token = localStorage.getItem("token");
    let username = localStorage.getItem("username");
    let stompClient = null;
    let currentRoom = "public";
    let latestRooms = [];
    const MESSAGES = {
        authRequired: "Username and password are required.",
        signedInAs: (name) => `Signed in as: ${name}`,
        logoutSuccess: "Logged out successfully.",
        accountCreated: (name) => `Account created. Signed in as: ${name}`,
        activeRoom: (roomName) => `Active room: ${roomName}`,
        websocketMissing: "No WebSocket connection.",
        noPublicRooms: "No public rooms available.",
        createdRoomVisible: (roomName) => `Room \"${roomName}\" created and ready to join.`,
        createdRoomQuickJoin: (roomName) => `Room \"${roomName}\" created. Quick Join button added.`,
        roomNameRequired: "Enter a room name.",
        friendUsernameRequired: "Enter your friend's username.",
        invitationSent: "Invitation sent.",
        usernameRequired: "Enter a username.",
        uploadPending: "File upload requires backend endpoint alignment."
    };

    function setInfo(message) {
        document.getElementById("user-info").textContent = message || "";
    }

    async function login() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert(MESSAGES.authRequired);
            return;
        }

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue.includes("@") ? usernameValue : usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";
        setInfo(MESSAGES.signedInAs(username));

        connectWebSocket();
        loadPublicRooms();
    }

    async function logout() {
        if (!token) {
            document.getElementById("auth-panel").style.display = "flex";
            return;
        }

        try {
            await fetch("/api/auth/logout", {
                method: "POST",
                headers: authHeaders()
            });
        } catch (error) {
            console.error("Logout error:", error);
        }

        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }

        token = null;
        username = null;
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        document.getElementById("messages").innerHTML = "";
        document.getElementById("auth-panel").style.display = "flex";
        setInfo(MESSAGES.logoutSuccess);
    }

    async function register() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert(MESSAGES.authRequired);
            return;
        }

        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";
        setInfo(MESSAGES.accountCreated(username));

        connectWebSocket();
        loadPublicRooms();
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token
        };
    }

    function connectWebSocket() {
        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: "Bearer " + token },
            function () {
                subscribeRoom(currentRoom);
            },
            function (error) {
                console.error("WebSocket error:", error);
            }
        );
    }

    function subscribeRoom(roomName) {
        currentRoom = roomName;

        if (!stompClient || !stompClient.connected) {
            return;
        }

        stompClient.subscribe("/topic/room/" + roomName, onMessageReceived);
        document.getElementById("messages").innerHTML = "";
        setInfo(MESSAGES.activeRoom(roomName));
    }

    function onMessageReceived(payload) {
        const msg = JSON.parse(payload.body);

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.content || ""}`;

        if (msg.attachmentUrl) {
            div.innerHTML += `<br><a href="${msg.attachmentUrl}" target="_blank">📎 File</a>`;
        }

        const delBtn = document.createElement("span");
        delBtn.className = "delete-btn";
        delBtn.innerHTML = "🗑";
        delBtn.onclick = () => deleteMessage(msg.id || 0);

        div.appendChild(delBtn);

        document.getElementById("messages").appendChild(div);
        document.getElementById("messages").scrollTop = 999999;
    }

    function sendMessage() {
        const input = document.getElementById("message-input");
        const content = input.value.trim();

        if (!content) {
            return;
        }

        if (!stompClient || !stompClient.connected) {
            alert(MESSAGES.websocketMissing);
            return;
        }

        stompClient.send(
            "/app/chat.sendMessage/" + currentRoom,
            {},
            JSON.stringify({
                content: content
            })
        );

        input.value = "";
    }

    function deleteMessage(messageId) {
        if (!stompClient || !stompClient.connected) {
            return;
        }

        stompClient.send(
            "/app/chat.deleteMessage/" + currentRoom,
            {},
            JSON.stringify({
                messageId: messageId
            })
        );
    }

    function normalizeRoomName(room) {
        if (typeof room === "string") {
            return room;
        }

        return room?.name || room?.roomName || room?.id || null;
    }

    function renderRoomNames(rooms) {
        const roomNames = document.getElementById("room-names");
        roomNames.innerHTML = "";

        if (!rooms.length) {
            const li = document.createElement("li");
            li.textContent = MESSAGES.noPublicRooms;
            roomNames.appendChild(li);
            return;
        }

        rooms.forEach(room => {
            const name = normalizeRoomName(room);
            if (!name) {
                return;
            }

            const li = document.createElement("li");
            const joinBtn = document.createElement("button");
            joinBtn.textContent = `Join ${name}`;
            joinBtn.onclick = () => subscribeRoom(name);
            li.appendChild(joinBtn);
            roomNames.appendChild(li);
        });
    }

    async function loadPublicRooms(selectedRoomName = null) {
        if (!token) {
            return;
        }

        const response = await fetch("/api/rooms/public", {
            headers: authHeaders()
        });

        if (!response.ok) {
            console.error(await response.text());
            return;
        }

        const rooms = await response.json();
        latestRooms = rooms;

        const list = document.getElementById("room-list");
        list.innerHTML = "";
        document.getElementById("room-count").textContent = "Rooms visible: " + rooms.length;
        renderRoomNames(rooms);

        rooms.forEach(room => {
            const roomName = normalizeRoomName(room);
            if (!roomName) {
                return;
            }
            const btn = document.createElement("button");
            btn.textContent = roomName;
            btn.style.display = "block";
            btn.style.margin = "5px 0";
            btn.onclick = () => subscribeRoom(btn.textContent);
            list.appendChild(btn);
        });

        if (selectedRoomName) {
            const exists = rooms.some(room => normalizeRoomName(room) === selectedRoomName);
            if (exists) {
                setInfo(MESSAGES.createdRoomVisible(selectedRoomName));
                subscribeRoom(selectedRoomName);
            } else {
                const fallbackRoom = document.createElement("button");
                fallbackRoom.textContent = selectedRoomName;
                fallbackRoom.style.display = "block";
                fallbackRoom.style.margin = "5px 0";
                fallbackRoom.onclick = () => subscribeRoom(selectedRoomName);
                list.prepend(fallbackRoom);

                const fallbackLi = document.createElement("li");
                const fallbackJoin = document.createElement("button");
                fallbackJoin.textContent = `Join ${selectedRoomName}`;
                fallbackJoin.onclick = () => subscribeRoom(selectedRoomName);
                fallbackLi.appendChild(fallbackJoin);
                document.getElementById("room-names").prepend(fallbackLi);

                setInfo(MESSAGES.createdRoomQuickJoin(selectedRoomName));
            }
        }
    }

    async function createRoom() {
        const name = document.getElementById("new-room-name").value.trim();

        if (!name) {
            alert(MESSAGES.roomNameRequired);
            return;
        }

        const response = await fetch("/api/rooms", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                name: name
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        document.getElementById("new-room-name").value = "";
        await loadPublicRooms(name);
    }

    async function sendFriendRequest() {
        const friendUsername = document.getElementById("friend-username").value.trim();

        if (!friendUsername) {
            alert(MESSAGES.friendUsernameRequired);
            return;
        }

        const response = await fetch("/api/friends/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                username: friendUsername
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        alert(MESSAGES.invitationSent);
    }

    function startPrivateChat() {
        const privateUsername = document.getElementById("private-username").value.trim();

        if (!privateUsername) {
            alert(MESSAGES.usernameRequired);
            return;
        }

        subscribeRoom("private-" + privateUsername);
    }

    async function uploadAndSend() {
        alert(MESSAGES.uploadPending);
    }

    window.onload = function () {
        if (token) {
            document.getElementById("auth-panel").style.display = "none";
            connectWebSocket();
            loadPublicRooms();
        }
    };
</script>

</body>
</html>
