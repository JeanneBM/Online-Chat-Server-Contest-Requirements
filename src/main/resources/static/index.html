<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Online Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, sans-serif; display:flex; flex-direction:column; height:100vh; }
        .header { background:#007bff; color:white; padding:12px; text-align:center; font-size:1.2em; }
        .main { display:flex; flex:1; overflow:hidden; }
        .sidebar { width:260px; background:#f8f9fa; padding:15px; overflow-y:auto; border-right:1px solid #ddd; }
        .chat-area { flex:1; display:flex; flex-direction:column; }
        .messages { flex:1; padding:15px; overflow-y:auto; background:#fff; }
        .message { margin-bottom:12px; padding:10px; border-radius:8px; background:#f1f1f1; position:relative; }
        .message .delete-btn { position:absolute; right:8px; top:8px; color:red; cursor:pointer; display:none; }
        .message:hover .delete-btn { display:block; }
        .input-area { padding:12px; background:#f8f9fa; display:flex; gap:8px; align-items:center; }
        .room-section { margin-top:10px; padding:8px; border:1px solid #ddd; background:#fff; border-radius:6px; }
        .notification-box { margin-top:10px; padding:8px; border:1px solid #ffc107; background:#fff3cd; border-radius:6px; font-size:0.9em; }
        .badge { display:inline-block; min-width:24px; padding:2px 6px; border-radius:999px; background:#dc3545; color:#fff; text-align:center; font-weight:bold; margin-left:6px; }
        .room-user { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:4px 0; }
        #room-list button { width:100%; text-align:left; margin:4px 0; padding:6px; }
        #room-list-empty { font-size:0.9em; color:#666; margin-top:6px; }
    </style>
</head>
<body>

<div class="header">Online Chat - FINAL VERSION</div>

<div class="main">
    <div class="sidebar">
        <h4>Public Rooms</h4>
        <button onclick="loadPublicRooms()">Refresh</button>
        <button onclick="logout()" style="margin-left:8px;background:#dc3545;color:white;">Logout</button>
        <div class="room-section">
            <strong>Available room list</strong>
            <div id="room-count" style="margin-top:8px;font-size:0.9em;color:#666;"></div>
            <div id="room-list-empty">No rooms loaded yet. Click Refresh.</div>
            <div id="room-list"></div>
        </div>
        <div id="active-room-label" style="margin-top:8px;font-size:0.9em;color:#007bff;">Active room: public</div>
        <div class="notification-box">
            <strong>Unread</strong><br>
            Private <span id="unread-private" class="badge">0</span><br>
            Rooms <span id="unread-room" class="badge">0</span>
        </div>

        <hr>
        <input id="new-room-name" placeholder="Room name">
        <button onclick="createRoom()">Create</button>

        <hr>
        <h4>Friends</h4>
        <input id="friend-username" placeholder="Username">
        <button onclick="sendFriendRequest()">Invite</button>
        <div id="friends-list"></div>

        <hr>
        <h4>Direct Chat 1:1</h4>
        <input id="private-username" placeholder="Username">
        <button onclick="startPrivateChat()">Start</button>

        <hr>
        <h4>Users in room</h4>
        <button onclick="loadRoomUsers()">Refresh users</button>
        <div id="room-users-list"></div>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="message-input" placeholder="Type a message..." style="flex:1">
            <input type="file" id="file-input" style="display:none" onchange="uploadAndSend()">
            <button onclick="document.getElementById('file-input').click()">📎</button>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<div id="auth-panel" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;">
    <h2>Online Chat</h2>
    <input id="username" placeholder="Username" value="testuser" style="margin:8px;padding:12px;width:300px;"><br>
    <input id="password" type="password" placeholder="Password" value="test123" style="margin:8px;padding:12px;width:300px;"><br>
    <button onclick="login()" style="margin:8px;padding:12px 30px;width:300px;">Sign In</button>
    <button onclick="register()" style="margin:8px;padding:12px 30px;width:300px;background:#28a745;">Register</button>
    <div id="user-info" style="margin-top:12px;font-size:14px;opacity:0.9;"></div>
</div>

<script>
    let token = localStorage.getItem("token");
    let username = localStorage.getItem("username");
    let stompClient = null;
    let roomSubscription = null;
    let currentRoom = "public";
    let currentRoomId = null;
    let pendingRoomToJoin = null;
    let latestRooms = [];
    let unreadPollInterval = null;
    let presencePingInterval = null;
    const MESSAGES = {
        authRequired: "Username and password are required.",
        signedInAs: (name) => `Signed in as: ${name}`,
        logoutSuccess: "Logged out successfully.",
        accountCreated: (name) => `Account created. Signed in as: ${name}`,
        activeRoom: (roomName) => `Active room: ${roomName}`,
        websocketMissing: "No WebSocket connection.",
        noPublicRooms: "No public rooms available.",
        createdRoomVisible: (roomName) => `Room \"${roomName}\" created and ready to join.`,
        createdRoomQuickJoin: (roomName) => `Room \"${roomName}\" created. Quick Join button added.`,
        roomNameRequired: "Enter a room name.",
        friendUsernameRequired: "Enter your friend's username.",
        invitationSent: "Invitation sent.",
        usernameRequired: "Enter a username.",
        uploadPending: "File upload requires backend endpoint alignment.",
        roomAlreadyExists: (roomName) => `Room "${roomName}" already exists. You can join it from the room list.`,
        roomListLoaded: (count) => `Loaded public rooms: ${count}`
    };

    function setInfo(message) {
        document.getElementById("user-info").textContent = message || "";
    }

    function translateServerMessage(rawMessage) {
        if (!rawMessage) {
            return "Unexpected server error.";
        }

        const message = rawMessage.trim();
        const lower = message.toLowerCase();

        if (lower.includes("pokój o tej nazwie już istnieje") || lower.includes("pokoj o tej nazwie juz istnieje")) {
            return "A room with this name already exists.";
        }
        if (lower.includes("użytkownik") || lower.includes("uzytkownik")) {
            return "User-related request failed.";
        }
        if (lower.includes("nie znaleziono")) {
            return "Requested resource was not found.";
        }

        return message;
    }

    async function login() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert(MESSAGES.authRequired);
            return;
        }

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue.includes("@") ? usernameValue : usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(translateServerMessage(await response.text()));
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";
        setInfo(MESSAGES.signedInAs(username));

        connectWebSocket();
        loadPublicRooms();
        refreshUnreadCounts();
        loadFriends();
        if (unreadPollInterval) clearInterval(unreadPollInterval);
        unreadPollInterval = setInterval(refreshUnreadCounts, 5000);
    }

    async function logout() {
        if (!token) {
            document.getElementById("auth-panel").style.display = "flex";
            return;
        }

        try {
            await fetch("/api/auth/logout", {
                method: "POST",
                headers: authHeaders()
            });
        } catch (error) {
            console.error("Logout error:", error);
        }

        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }
        roomSubscription = null;
        pendingRoomToJoin = null;
        currentRoom = "public";
        currentRoomId = null;
        document.getElementById("active-room-label").textContent = "Active room: public";

        token = null;
        username = null;
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        if (unreadPollInterval) clearInterval(unreadPollInterval);
        if (presencePingInterval) clearInterval(presencePingInterval);
        document.getElementById("messages").innerHTML = "";
        document.getElementById("auth-panel").style.display = "flex";
        setInfo(MESSAGES.logoutSuccess);
    }

    async function register() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert(MESSAGES.authRequired);
            return;
        }

        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(translateServerMessage(await response.text()));
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";
        setInfo(MESSAGES.accountCreated(username));

        connectWebSocket();
        loadPublicRooms();
        refreshUnreadCounts();
        loadFriends();
        if (unreadPollInterval) clearInterval(unreadPollInterval);
        unreadPollInterval = setInterval(refreshUnreadCounts, 5000);
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token
        };
    }

    function connectWebSocket() {
        if (stompClient && stompClient.connected) {
            return;
        }

        const socket = new SockJS("/ws-chat");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: "Bearer " + token },
            function () {
                const roomToOpen = pendingRoomToJoin || currentRoom;
                pendingRoomToJoin = null;
                subscribeRoom(roomToOpen);
                if (presencePingInterval) clearInterval(presencePingInterval);
                presencePingInterval = setInterval(() => {
                    if (stompClient && stompClient.connected) {
                        stompClient.send("/app/presence.ping", {}, "{}");
                    }
                }, 1000);
            },
            function (error) {
                console.error("WebSocket error:", error);
            }
        );
    }

    function resolveRoomId(roomName) {
        const room = latestRooms.find(r => normalizeRoomName(r) === roomName);
        return room?.id ?? null;
    }

    function subscribeRoom(roomName, roomId = null) {
        currentRoom = roomName;
        currentRoomId = roomId ?? resolveRoomId(roomName) ?? roomName;
        document.getElementById("active-room-label").textContent = `Active room: ${roomName}`;
        setInfo(MESSAGES.activeRoom(roomName));

        if (!stompClient || !stompClient.connected) {
            pendingRoomToJoin = roomName;
            connectWebSocket();
            return;
        }

        if (!currentRoomId) {
            setInfo(`Unable to open room "${roomName}" (missing room id).`);
            return;
        }

        if (roomSubscription) {
            roomSubscription.unsubscribe();
        }

        roomSubscription = stompClient.subscribe("/topic/room/" + currentRoomId, onMessageReceived);
        document.getElementById("messages").innerHTML = "";
        setInfo(MESSAGES.activeRoom(roomName));
        if (currentRoom !== "public" && !currentRoom.startsWith("private-")) {
            markRoomRead(currentRoom);
        }
        loadRoomUsers();
    }

    function onMessageReceived(payload) {
        const msg = JSON.parse(payload.body);

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.content || ""}`;

        if (msg.attachmentUrl) {
            div.innerHTML += `<br><a href="${msg.attachmentUrl}" target="_blank">📎 File</a>`;
        }

        const delBtn = document.createElement("span");
        delBtn.className = "delete-btn";
        delBtn.innerHTML = "🗑";
        delBtn.onclick = () => deleteMessage(msg.id || 0);

        div.appendChild(delBtn);

        document.getElementById("messages").appendChild(div);
        document.getElementById("messages").scrollTop = 999999;
        refreshUnreadCounts();
    }

    function sendMessage() {
        const input = document.getElementById("message-input");
        const content = input.value.trim();

        if (!content) {
            return;
        }

        if (!stompClient || !stompClient.connected) {
            alert(MESSAGES.websocketMissing);
            return;
        }

        if (!currentRoomId) {
            alert("Room is not ready yet. Please refresh room list and try again.");
            return;
        }

        stompClient.send(
            "/app/chat/send/" + currentRoomId,
            {},
            JSON.stringify({
                content: content
            })
        );

        input.value = "";
    }

    function deleteMessage(messageId) {
        if (!stompClient || !stompClient.connected || !currentRoomId) {
            return;
        }

        stompClient.send(
            "/app/chat.deleteMessage/" + currentRoomId,
            {},
            JSON.stringify({
                messageId: messageId
            })
        );
    }

    function normalizeRoomName(room) {
        if (typeof room === "string") {
            return room;
        }

        return room?.name || room?.roomName || room?.id || null;
    }

    function upsertRoomJoinButton(roomName, roomId = null, prepend = false) {
        const list = document.getElementById("room-list");
        const existingButtons = Array.from(list.querySelectorAll("button"));
        const alreadyVisible = existingButtons.some(btn => btn.dataset.roomName === roomName);

        if (alreadyVisible) {
            return;
        }

        const btn = document.createElement("button");
        btn.dataset.roomName = roomName;
        if (roomId) {
            btn.dataset.roomId = String(roomId);
        }
        btn.textContent = `Join ${roomName}`;
        btn.onclick = () => subscribeRoom(roomName, roomId);

        if (prepend) {
            list.prepend(btn);
        } else {
            list.appendChild(btn);
        }
    }

    function renderFixedRoomButtons() {
        const publicRoom = latestRooms.find(room => normalizeRoomName(room) === "public");
        upsertRoomJoinButton("public", publicRoom?.id ?? null, true);
    }

    async function loadPublicRooms(selectedRoomName = null) {
        if (!token) {
            return;
        }

        const response = await fetch("/api/rooms/public", {
            headers: authHeaders()
        });

        if (!response.ok) {
            console.error(await response.text());
            if (selectedRoomName) {
                const selectedRoom = latestRooms.find(room => normalizeRoomName(room) === selectedRoomName);
                upsertRoomJoinButton(selectedRoomName, selectedRoom?.id ?? null, true);
                document.getElementById("room-list-empty").textContent = "";
                setInfo(`Room "${selectedRoomName}" is available via Quick Join.`);
            }
            return;
        }

        const rooms = await response.json();
        latestRooms = rooms;
        const resolvedCurrentRoomId = resolveRoomId(currentRoom);
        currentRoomId = resolvedCurrentRoomId ?? currentRoom;
        setInfo(MESSAGES.roomListLoaded(rooms.length));

        if (stompClient && stompClient.connected && resolvedCurrentRoomId
            && (!roomSubscription || String(resolvedCurrentRoomId) !== String(currentRoom))) {
            subscribeRoom(currentRoom, resolvedCurrentRoomId);
        }

        const list = document.getElementById("room-list");
        list.innerHTML = "";
        const roomEmptyInfo = document.getElementById("room-list-empty");
        document.getElementById("room-count").textContent = "Rooms visible: " + rooms.length;
        roomEmptyInfo.textContent = rooms.length ? "" : MESSAGES.noPublicRooms;
        renderFixedRoomButtons();

        rooms.forEach(room => {
            const roomName = normalizeRoomName(room);
            if (!roomName) {
                return;
            }
            upsertRoomJoinButton(roomName, room.id);
        });

        if (selectedRoomName) {
            const exists = rooms.some(room => normalizeRoomName(room) === selectedRoomName);
            if (exists) {
                setInfo(MESSAGES.createdRoomVisible(selectedRoomName));
                subscribeRoom(selectedRoomName);
            } else {
                const selectedRoom = rooms.find(room => normalizeRoomName(room) === selectedRoomName);
                upsertRoomJoinButton(selectedRoomName, selectedRoom?.id ?? null, true);
                roomEmptyInfo.textContent = "";

                setInfo(MESSAGES.createdRoomQuickJoin(selectedRoomName));
            }
        }
    }

    async function createRoom() {
        const name = document.getElementById("new-room-name").value.trim();

        if (!name) {
            alert(MESSAGES.roomNameRequired);
            return;
        }

        const response = await fetch("/api/rooms", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                name: name
            })
        });

        if (!response.ok) {
            const serverMessage = await response.text();
            const translatedMessage = translateServerMessage(serverMessage);

            if (translatedMessage === "A room with this name already exists.") {
                await loadPublicRooms(name);
                const existingRoom = latestRooms.find(room => normalizeRoomName(room) === name);
                upsertRoomJoinButton(name, existingRoom?.id ?? null, true);
                document.getElementById("room-list-empty").textContent = "";
                alert(MESSAGES.roomAlreadyExists(name));
                return;
            }

            alert(translatedMessage);
            return;
        }

        document.getElementById("new-room-name").value = "";
        await loadPublicRooms(name);
    }

    async function sendFriendRequest() {
        const friendUsername = document.getElementById("friend-username").value.trim();

        if (!friendUsername) {
            alert(MESSAGES.friendUsernameRequired);
            return;
        }

        const response = await fetch("/api/friends/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                username: friendUsername
            })
        });

        if (!response.ok) {
            alert(translateServerMessage(await response.text()));
            return;
        }

        alert(MESSAGES.invitationSent);
        loadFriends();
    }

    function startPrivateChat() {
        const privateUsername = document.getElementById("private-username").value.trim();

        if (!privateUsername) {
            alert(MESSAGES.usernameRequired);
            return;
        }

        subscribeRoom("private-" + privateUsername);
        markPrivateRead(privateUsername);
        refreshUnreadCounts();
    }

    async function uploadAndSend() {
        alert(MESSAGES.uploadPending);
    }

    window.onload = function () {
        if (token) {
            document.getElementById("auth-panel").style.display = "none";
            connectWebSocket();
            loadPublicRooms();
            loadFriends();
            refreshUnreadCounts();
            if (unreadPollInterval) clearInterval(unreadPollInterval);
            unreadPollInterval = setInterval(refreshUnreadCounts, 5000);
        }
    };

    async function refreshUnreadCounts() {
        if (!token) return;
        const response = await fetch("/api/messages/unread-count", { headers: authHeaders() });
        if (!response.ok) return;
        const data = await response.json();
        document.getElementById("unread-private").textContent = data.privateMessages ?? 0;
        document.getElementById("unread-room").textContent = data.roomMessages ?? 0;
    }

    async function loadFriends() {
        if (!token) return;
        const response = await fetch("/api/friends", { headers: authHeaders() });
        if (!response.ok) return;
        const friends = await response.json();
        const container = document.getElementById("friends-list");
        container.innerHTML = "";
        friends.forEach(friend => {
            const div = document.createElement("div");
            div.textContent = `${friend.username} (${friend.presenceStatus})`;
            container.appendChild(div);
        });
    }

    async function loadRoomUsers() {
        if (!token || currentRoom === "public" || currentRoom.startsWith("private-")) {
            document.getElementById("room-users-list").innerHTML = "";
            return;
        }
        const room = latestRooms.find(r => normalizeRoomName(r) === currentRoom);
        if (!room?.id) return;
        const response = await fetch(`/api/rooms/${room.id}/users`, { headers: authHeaders() });
        if (!response.ok) return;
        const users = await response.json();
        const container = document.getElementById("room-users-list");
        container.innerHTML = "";
        users.forEach(user => {
            const row = document.createElement("div");
            row.className = "room-user";
            const role = user.owner ? "OWNER" : (user.admin ? "ADMIN" : "MEMBER");
            row.innerHTML = `<span>${user.username} (${user.presenceStatus}, ${role})</span>`;
            const btn = document.createElement("button");
            btn.textContent = "Invite";
            btn.onclick = () => {
                document.getElementById("friend-username").value = user.username;
            };
            row.appendChild(btn);
            container.appendChild(row);
        });
    }

    async function markPrivateRead(privateUsername) {
        if (!token || !privateUsername) return;
        await fetch(`/api/messages/private/${privateUsername}/read`, {
            method: "POST",
            headers: authHeaders()
        });
    }

    async function markRoomRead(roomName) {
        if (!token || !roomName) return;
        const room = latestRooms.find(r => normalizeRoomName(r) === roomName);
        if (!room?.id) return;
        await fetch(`/api/messages/room/${room.id}/read`, {
            method: "POST",
            headers: authHeaders()
        });
        refreshUnreadCounts();
    }
</script>

</body>
</html>
