<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Online Chat - FINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, sans-serif; display:flex; flex-direction:column; height:100vh; }
        .header { background:#007bff; color:white; padding:12px; text-align:center; font-size:1.2em; }
        .main { display:flex; flex:1; overflow:hidden; }
        .sidebar { width:260px; background:#f8f9fa; padding:15px; overflow-y:auto; border-right:1px solid #ddd; }
        .chat-area { flex:1; display:flex; flex-direction:column; }
        .messages { flex:1; padding:15px; overflow-y:auto; background:#fff; }
        .message { margin-bottom:12px; padding:10px; border-radius:8px; background:#f1f1f1; position:relative; }
        .message .delete-btn { position:absolute; right:8px; top:8px; color:red; cursor:pointer; display:none; }
        .message:hover .delete-btn { display:block; }
        .input-area { padding:12px; background:#f8f9fa; display:flex; gap:8px; align-items:center; }
    </style>
</head>
<body>

<div class="header">Online Chat - FINAL VERSION</div>

<div class="main">
    <div class="sidebar">
        <h4>Publiczne pokoje</h4>
        <button onclick="loadPublicRooms()">Odśwież</button>
        <button onclick="logout()" style="margin-left:8px;background:#dc3545;color:white;">Wyloguj</button>
        <div id="room-list"></div>

        <hr>
        <input id="new-room-name" placeholder="Nazwa pokoju">
        <button onclick="createRoom()">Utwórz</button>

        <hr>
        <h4>Znajomi</h4>
        <input id="friend-username" placeholder="Username">
        <button onclick="sendFriendRequest()">Zaproszenie</button>
        <div id="friends-list"></div>

        <hr>
        <h4>Czat 1:1</h4>
        <input id="private-username" placeholder="Username">
        <button onclick="startPrivateChat()">Rozpocznij</button>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="message-input" placeholder="Napisz wiadomość..." style="flex:1">
            <input type="file" id="file-input" style="display:none" onchange="uploadAndSend()">
            <button onclick="document.getElementById('file-input').click()">📎</button>
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>
</div>

<div id="auth-panel" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;">
    <h2>Online Chat</h2>
    <input id="username" placeholder="Username" value="testuser" style="margin:8px;padding:12px;width:300px;"><br>
    <input id="password" type="password" placeholder="Hasło" value="test123" style="margin:8px;padding:12px;width:300px;"><br>
    <button onclick="login()" style="margin:8px;padding:12px 30px;width:300px;">Zaloguj</button>
    <button onclick="register()" style="margin:8px;padding:12px 30px;width:300px;background:#28a745;">Zarejestruj</button>
</div>

<script>
    let token = localStorage.getItem("token");
    let username = localStorage.getItem("username");
    let stompClient = null;
    let currentRoom = "public";

    async function login() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert("Username i hasło są wymagane");
            return;
        }

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue.includes("@") ? usernameValue : usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";

        connectWebSocket();
        loadPublicRooms();
    }

    async function logout() {
        if (!token) {
            document.getElementById("auth-panel").style.display = "flex";
            return;
        }

        try {
            await fetch("/api/auth/logout", {
                method: "POST",
                headers: authHeaders()
            });
        } catch (error) {
            console.error("Błąd logout:", error);
        }

        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }

        token = null;
        username = null;
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        document.getElementById("messages").innerHTML = "";
        document.getElementById("auth-panel").style.display = "flex";
    }

    async function register() {
        const usernameValue = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!usernameValue || !password) {
            alert("Username i hasło są wymagane");
            return;
        }

        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: usernameValue + "@local.test",
                username: usernameValue,
                password: password
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        const data = await response.json();

        token = data.token;
        username = data.username;

        localStorage.setItem("token", token);
        localStorage.setItem("username", username);

        document.getElementById("auth-panel").style.display = "none";

        connectWebSocket();
        loadPublicRooms();
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token
        };
    }

    function connectWebSocket() {
        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: "Bearer " + token },
            function () {
                subscribeRoom(currentRoom);
            },
            function (error) {
                console.error("WebSocket error:", error);
            }
        );
    }

    function subscribeRoom(roomName) {
        currentRoom = roomName;

        if (!stompClient || !stompClient.connected) {
            return;
        }

        stompClient.subscribe("/topic/room/" + roomName, onMessageReceived);
        document.getElementById("messages").innerHTML = "";
    }

    function onMessageReceived(payload) {
        const msg = JSON.parse(payload.body);

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.content || ""}`;

        if (msg.attachmentUrl) {
            div.innerHTML += `<br><a href="${msg.attachmentUrl}" target="_blank">📎 Plik</a>`;
        }

        const delBtn = document.createElement("span");
        delBtn.className = "delete-btn";
        delBtn.innerHTML = "🗑";
        delBtn.onclick = () => deleteMessage(msg.id || 0);

        div.appendChild(delBtn);

        document.getElementById("messages").appendChild(div);
        document.getElementById("messages").scrollTop = 999999;
    }

    function sendMessage() {
        const input = document.getElementById("message-input");
        const content = input.value.trim();

        if (!content) {
            return;
        }

        if (!stompClient || !stompClient.connected) {
            alert("Brak połączenia z WebSocket");
            return;
        }

        stompClient.send(
            "/app/chat.sendMessage/" + currentRoom,
            {},
            JSON.stringify({
                content: content
            })
        );

        input.value = "";
    }

    function deleteMessage(messageId) {
        if (!stompClient || !stompClient.connected) {
            return;
        }

        stompClient.send(
            "/app/chat.deleteMessage/" + currentRoom,
            {},
            JSON.stringify({
                messageId: messageId
            })
        );
    }

    async function loadPublicRooms() {
        if (!token) {
            return;
        }

        const response = await fetch("/api/rooms/public", {
            headers: authHeaders()
        });

        if (!response.ok) {
            console.error(await response.text());
            return;
        }

        const rooms = await response.json();
        const list = document.getElementById("room-list");
        list.innerHTML = "";

        rooms.forEach(room => {
            const btn = document.createElement("button");
            btn.textContent = room.name || room.roomName || room;
            btn.style.display = "block";
            btn.style.margin = "5px 0";
            btn.onclick = () => subscribeRoom(btn.textContent);
            list.appendChild(btn);
        });
    }

    async function createRoom() {
        const name = document.getElementById("new-room-name").value.trim();

        if (!name) {
            alert("Podaj nazwę pokoju");
            return;
        }

        const response = await fetch("/api/rooms", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                name: name
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        document.getElementById("new-room-name").value = "";
        loadPublicRooms();
    }

    async function sendFriendRequest() {
        const friendUsername = document.getElementById("friend-username").value.trim();

        if (!friendUsername) {
            alert("Podaj username znajomego");
            return;
        }

        const response = await fetch("/api/friends/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...authHeaders()
            },
            body: JSON.stringify({
                username: friendUsername
            })
        });

        if (!response.ok) {
            alert(await response.text());
            return;
        }

        alert("Wysłano zaproszenie");
    }

    function startPrivateChat() {
        const privateUsername = document.getElementById("private-username").value.trim();

        if (!privateUsername) {
            alert("Podaj username");
            return;
        }

        subscribeRoom("private-" + privateUsername);
    }

    async function uploadAndSend() {
        alert("Upload plików wymaga dopasowania endpointu backendu.");
    }

    window.onload = function () {
        if (token) {
            document.getElementById("auth-panel").style.display = "none";
            connectWebSocket();
            loadPublicRooms();
        }
    };
</script>

</body>
</html>
