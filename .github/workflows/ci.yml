name: CI

on:
  push:
  pull_request:

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - name: API smoke test (context starts)
        run: ./mvnw -B -DskipTests spring-boot:run & sleep 25 && curl -f http://localhost:8080/ || (cat target/surefire-reports/*.txt || true; exit 1)
